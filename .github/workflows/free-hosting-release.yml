name: Free hosting release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'package*.json'
      - 'tsconfig.json'
      - 'scripts/package-free-release.cjs'
      - '.github/workflows/free-hosting-release.yml'
permissions:
  contents: write
concurrency:
  group: free-hosting-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: node --check dist/index.js
      - run: node scripts/package-free-release.cjs
      - name: Check production install and generated client
        working-directory: .release/free
        run: |
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          npm run db:generate
          node -e "const {PrismaClient}=require('@prisma/client'); const client=new PrismaClient(); console.log('Prisma client constructed');"
          rm -rf node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: kraxxbot-free-release
          path: .release/free/
          include-hidden-files: true
      - name: Publish compiled deployment branch
        working-directory: .release/free
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -b bot-hosting-free
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Precompiled release from $GITHUB_SHA"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push --force origin HEAD:refs/heads/bot-hosting-free
