name: Production Build & Release Artifact

on:
  push:
    branches: [ main, prod-recovery ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build & Package Production Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client (Linux Architecture)
        run: npx prisma generate

      - name: Run Typecheck
        run: npm run typecheck

      - name: Install Dashboard Dependencies for Tests
        run: npm ci --prefix dashboard

      - name: Run Automated Tests
        env:
          NODE_ENV: test
          DISCORD_TOKEN: ci-fake-token-never-use
          DISCORD_CLIENT_ID: '000000000000000000'
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/kraxxbot_ci_unit?schema=public
        run: npm test

      - name: Compile TypeScript Production Code
        run: npm run build

      - name: Verify Compiled Entry Point
        run: node --check dist/index.js

      - name: Package Release Artifact
        run: |
          mkdir -p release
          cp -r dist prisma package.json package-lock.json DEPLOYMENT.md release/
          cd release
          zip -r ../kraxxbot-production-release.zip .

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kraxxbot-production-release
          path: kraxxbot-production-release.zip
          retention-days: 30
